@if (reserva) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(reserva.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="reservaDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-reserva-heading" jhiTranslate="aerolineaVirtualApp.reserva.delete.question" [translateValues]="{ id: reserva.id }">
        Are you sure you want to delete Reserva {{ reserva.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="jhi-confirm-delete-reserva" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
